syntax = "proto3";

package document.processor.v1;

option go_package = "ai_service/proto";

service DocumentProcessor {
  rpc ProcessDocument(ProcessDocumentRequest) returns (ProcessDocumentResponse);
}

enum ModelChoice {
  MODEL_CHOICE_UNSPECIFIED = 0;
  MODEL_CHOICE_LOCAL = 1;
}

message ProcessDocumentRequest {
  bytes file_content = 1;
  string file_name = 2;
  ModelChoice model_choice = 3;
  
  // Optional: A specific document type to give the AI context (e.g., "Invoice")
  string document_type = 4;
  
  // Optional: Specific fields the AI MUST hunt for and extract
  repeated string target_fields = 5;
  
  // Optional: Strict JSON Schema to enforce the output format
  string json_schema = 6;
  
  // Optional: Custom instructions that will be appended to the base prompt
  string custom_instructions = 7;
}

message ProcessDocumentResponse {
  bool success = 1;
  string error_message = 2;
  string metadata_json = 3;
}
